name: Release Windows EXE

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build and publish Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare release asset name
        shell: pwsh
        run: |
          $safeTag = "${{ github.ref_name }}" -replace "[^A-Za-z0-9._-]", "-"
          "ASSET_NAME=umt-to-nmea-windows-x64-$safeTag.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test converter with Python
        shell: pwsh
        run: |
          python tools\umt_to_nmea\umt_to_nmea.py sample_data\xidantot3.umt -o build\smoke-python.nmea --time-start 0 --time-end 1

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --name umt-to-nmea tools\umt_to_nmea\umt_to_nmea.py
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item -LiteralPath dist\umt-to-nmea.exe -Destination "release\$env:ASSET_NAME" -Force

      - name: Smoke test EXE
        shell: pwsh
        run: |
          & "release\$env:ASSET_NAME" sample_data\xidantot3.umt -o build\smoke-exe.nmea --time-start 0 --time-end 1
          Get-Item build\smoke-exe.nmea

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: release/${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Publish EXE to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $assetPath = "release\$env:ASSET_NAME"
          gh release view $env:TAG_NAME *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:TAG_NAME $assetPath --clobber
          } else {
            gh release create $env:TAG_NAME $assetPath --title $env:TAG_NAME --notes "Windows EXE build for $env:TAG_NAME."
          }
