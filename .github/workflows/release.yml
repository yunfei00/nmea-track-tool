name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --name nmea-slimmer src/nmea_slimmer/app.py
      - name: Package ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/nmea-slimmer.exe release/
          Copy-Item README.md release/
          if (Test-Path sample_data) { Copy-Item sample_data release/sample_data -Recurse }
          Compress-Archive -Path release/* -DestinationPath nmea-slimmer-$tag-windows.zip -Force
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: nmea-slimmer-${{ github.ref_name }}-windows.zip
