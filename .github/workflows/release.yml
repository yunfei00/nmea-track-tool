name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: pytest

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --name nmea-track-tool gui/app.py
          pyinstaller --noconfirm --onefile --name umt-to-nmea tools/umt_to_nmea/umt_to_nmea.py
          pyinstaller --noconfirm --onefile --name nmea-slimmer src/nmea_slimmer/app.py

      - name: Package release ZIP files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          if (!(Test-Path dist/nmea-track-tool.exe)) { throw "Missing dist/nmea-track-tool.exe" }
          if (!(Test-Path dist/umt-to-nmea.exe)) { throw "Missing dist/umt-to-nmea.exe" }
          if (!(Test-Path dist/nmea-slimmer.exe)) { throw "Missing dist/nmea-slimmer.exe" }

          New-Item -ItemType Directory -Force -Path release/nmea-track-tool | Out-Null
          Copy-Item dist/nmea-track-tool.exe release/nmea-track-tool/
          Copy-Item README.md release/nmea-track-tool/
          if (Test-Path sample_data) { Copy-Item sample_data release/nmea-track-tool/sample_data -Recurse }
          Compress-Archive -Path release/nmea-track-tool/* -DestinationPath "dist-release/nmea-track-tool-windows-x64-$tag.zip" -Force

          New-Item -ItemType Directory -Force -Path release/umt-to-nmea | Out-Null
          Copy-Item dist/umt-to-nmea.exe release/umt-to-nmea/
          Copy-Item tools/umt_to_nmea/README.md release/umt-to-nmea/
          if (Test-Path sample_data/xidantot3.umt) { Copy-Item sample_data/xidantot3.umt release/umt-to-nmea/ }
          Compress-Archive -Path release/umt-to-nmea/* -DestinationPath "dist-release/umt-to-nmea-windows-x64-$tag.zip" -Force

          New-Item -ItemType Directory -Force -Path release/nmea-slimmer | Out-Null
          Copy-Item dist/nmea-slimmer.exe release/nmea-slimmer/
          Copy-Item README.md release/nmea-slimmer/
          Compress-Archive -Path release/nmea-slimmer/* -DestinationPath "dist-release/nmea-slimmer-windows-x64-$tag.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.zip
