name: Build

on:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --name nmea-slimmer src/nmea_slimmer/app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmea-slimmer-windows
          path: dist/nmea-slimmer.exe
          if-no-files-found: error
